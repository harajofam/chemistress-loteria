<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemistress Dominoes — The Game Parlor</title>
  <!-- Colyseus.js client: the SELF-HOSTED esbuild bundle from the client
       root (the stock UMD evaluates to an empty namespace in browsers —
       see BUILD-STATUS.md). No CDN scripts anywhere on this page. -->
  <script src="../colyseus.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ui">
    <h1>🁢 Chemistress Dominoes</h1>
    <p class="sub">The Game Parlor · classic draw dominoes, face to face · first to 100 takes the match</p>

    <div class="row">
      <label>Your Name</label>
      <input id="playerName" value="Jay" />
      <button id="btnJoin">Join Table</button>
      <button id="btnReady" disabled>Ready</button>
    </div>
    <div id="status">Status: Not connected.</div>

    <div id="table">
      <div class="panel">
        <h2>At the table</h2>
        <div id="players"></div>
        <div id="boneyard"></div>
      </div>

      <div class="panel grow">
        <h2>The board</h2>
        <div id="ends">Open ends: —</div>
        <div id="chain"><span class="empty">No tiles played yet.</span></div>
      </div>
    </div>

    <div class="panel">
      <h2>Your hand</h2>
      <div id="hand"><span class="empty">Join the table to be dealt in.</span></div>
      <div class="row actions">
        <button id="btnPlayLeft" disabled>◀ Play Left</button>
        <button id="btnPlayRight" disabled>Play Right ▶</button>
        <button id="btnDraw" disabled>Draw from Boneyard</button>
        <button id="btnPass" disabled>Pass</button>
      </div>
      <div id="hint"></div>
    </div>

    <div class="panel">
      <h2>Table talk</h2>
      <ul id="log"></ul>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
