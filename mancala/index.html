<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemistress Mancala — The Game Parlor</title>
  <!-- Colyseus.js client: the SELF-HOSTED esbuild bundle from the client
       root (the stock UMD evaluates to an empty namespace in browsers —
       see BUILD-STATUS.md). No CDN scripts anywhere on this page. -->
  <script src="../colyseus.js"></script>
  <script src="../door.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ui">
    <h1>🫘 Chemistress Mancala</h1>
    <p class="sub">The Game Parlor · Kalah mancala, face to face · sow counterclockwise · last seed in your store goes again · most seeds in your store wins</p>

    <div class="row">
      <label>Your Name</label>
      <input id="playerName" value="Jay" />
      <button id="btnJoin">Join Table</button>
      <button id="btnReady" disabled>Ready</button>
    </div>
    <div id="status">Status: Not connected.</div>

    <div id="table">
      <div class="panel">
        <h2>At the table</h2>
        <div id="players"></div>
        <div class="row actions">
          <button id="btnResign" disabled>Resign</button>
        </div>
      </div>

      <div class="panel grow">
        <h2>The board</h2>
        <div id="board"><span class="empty">Join the table to see the board.</span></div>
        <div id="hint"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Table talk</h2>
      <ul id="log"></ul>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
